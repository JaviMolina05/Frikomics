<div class="product-detail-container" *ngIf="comic">
  <div class="product-image">
    <img *ngIf="comic?.image" [src]="'http://localhost:8000/storage/' + comic.image" alt="{{ comic.title }}">
  </div>

  <div class="product-info">
    <h2>{{ comic.title }}</h2>
    <ul class="product-meta">
      <li><strong>Editorial:</strong> {{ comic.editorial }}</li>
      <li><strong>Género:</strong> {{ comic.genero }}</li>
      <li><strong>Tipo:</strong> {{ comic.tipo }}</li>
      <li><strong>ISBN:</strong> 978-84-1051-943-5</li>
      <li><strong>Issue:</strong> 256</li>
      <li><strong>Encuadernación:</strong> Rústica</li>
    </ul>
    <div class="social-icons">
      <img src="https://img.icons8.com/fluency/48/facebook-new.png" alt="Facebook">
      <img src="https://img.icons8.com/fluency/48/twitter.png" alt="Twitter">
      <img src="https://img.icons8.com/color/48/whatsapp--v1.png" alt="Whatsapp">
      <img src="https://img.icons8.com/color/48/new-post.png" alt="Email">
    </div>
  </div>

  <div class="product-sidebar">
    <p class="price">{{ comic.price }} €</p>
    <p class="tax-note">IVA incluido</p>

    <ng-container *ngIf="comic.stock > 0; else noStock">
      <button class="btn primary-btn" (click)="addToCart(comic)">🛒 Añadir a mi cesta</button>
      <button class="btn favorite-btn" (click)="toggleFavorite(comic)">
        <ng-container *ngIf="isFavorite(comic.id); else notFav">❤️ Favorito</ng-container>
        <ng-template #notFav>🤍 Añadir a Favoritos</ng-template>
      </button>
    </ng-container>



    <ng-template #noStock>
      <p class="out-of-stock">Producto sin stock</p>
    </ng-template>
  </div>

  <div class="product-description">
    <h3>Descripción del producto</h3>
    <p>{{ comic.description }}</p>
  </div>
</div>
