<div class="products">
  <div class="card" style="width: 18rem;">
    <img [src]="'http://localhost:8000/storage/' + comic.image" class="card-img-top" alt="{{comic.title}}"  (click)="detailComic(comic.id)">
    <div class="card-body">
      <h5 class="card-title">{{comic.title}}</h5>
      <p class="card-text">{{comic.price}}€</p>
      <a (click)="addToCart()" class="btn btn-primary">Añadir al carrito</a>
      <a (click)="addToFavorites()" class="btn btn-warning">Favoritos</a>
      @if (authService.isAdmin()) {
      <button class="btn btn-danger" (click)="deleteComic(comic.id)">
        Eliminar
      </button>
      }
    </div>
  </div>
</div>
