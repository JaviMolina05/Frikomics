<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">Frikomics</a>
    <div class="search-container">
      <input type="text" id="search" placeholder="Buscar..." />
      <button type="button" onclick="searchFunction()">Buscar</button>
    </div>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" routerLink="/" routerLinkActive="active">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos" routerLinkActive="active">Productos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/subastas" routerLinkActive="active">Subastas</a>
        </li>
        <li class="nav-item" *ngIf="!authService.isLoggedIn()">
          <a class="nav-link" routerLink="/login" routerLinkActive="active">Cuenta</a>
        </li>
        <li class="nav-item" *ngIf="authService.isLoggedIn()">
          <a class="nav-link" routerLink="/perfil" routerLinkActive="active">Cuenta</a>
        </li>
      </ul>
    </div>
    <div class="cart-dropdown" (mouseenter)="showCart = true" (mouseleave)="showCart = false">
      <img src="assets/107831.png" height="18px" width="18px" style="cursor: pointer;" />

      <div class="cart-preview" *ngIf="showCart">
  @if (cartItems.length > 0) {
    @for (item of cartItems; track item.comic_id) {
      <div class="cart-item">
        <p>
          {{ item.title }} x{{ item.quantity }} — ${{ item.total_price | number:'1.2-2' }}
        </p>
      </div>
    }
  } @else {
    <p>Tu carrito está vacío</p>
  }

        <a routerLink="/cart" class="btn btn-dark">Ver carrito</a>
      </div>
    </div>


  </div>
