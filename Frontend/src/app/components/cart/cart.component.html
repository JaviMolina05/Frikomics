<h1>Mi Compra</h1>

<table>
    <thead>
        <tr>
            <th>Artículo</th>
            <th>Cantidad</th>
            <th>P. Unid.</th>
            <th>Precio</th>
        </tr>
    </thead>
    <tbody>

        @for (item of cartItems; track item.comic_id) {
        <tr>
            <td class="product">
                <img src="https://via.placeholder.com/80x80.png?text=Caja" alt="Caja">
                <div class="product-name">{{item.title}}</div>
            </td>
            <td>
                <input type="number" value="{{item.quantity}}" style="width: 60px;">
                <span class="actions">
                    <a href="#">Actualizar</a> |
                    <a href="#">Eliminar</a>
                </span>
            </td>
            <td>14,20 €</td>
            <td><strong>14,20 €</strong></td>
        </tr>
        }

    </tbody>
</table>

<div class="summary">
    <h2>Gastos de envío</h2>
    <p>Seleccione para calcular los gastos de envío</p>
    <p style="color: #999;">Selecciona la zona de envío, la forma de pago y la forma de envío</p>

    <div class="form-grid">
        <div class="form-group">
            <label for="zona">Zona de Envío</label>
            <select id="zona">
                <option>Seleccione zona de envío</option>
            </select>
        </div>
        <div class="form-group">
            <label for="pago">Forma de Pago</label>
            <select id="pago">
                <option>Seleccione forma de pago</option>
            </select>
        </div>
        <div class="form-group">
            <label for="envio">Forma de Envío</label>
            <select id="envio">
                <option>Seleccione forma de envío</option>
            </select>
        </div>
    </div>
</div>
