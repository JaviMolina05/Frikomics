<div class="cuerpo">
  <!-- Botón visible solo en móvil -->
<button class="toggle-sidebar-btn" (click)="toggleSidebar()" *ngIf="isMobile">
  ☰ Menú
</button>

<!-- Sidebar con clase dinámica -->
<app-sidebar [ngClass]="{ 'mobile-sidebar': isMobile, 'visible': sidebarVisible }"></app-sidebar>

<div class="overlay" *ngIf="isMobile && sidebarVisible" (click)="closeSidebar()"></div>

  <div class="products" *ngIf="favoritos.length > 0; else sinFavoritos">
    <div *ngFor="let comic of favoritos" class="product-card">
      <img
        [src]="'http://localhost:8000/storage/' + comic.image"
        class="product-image"
        alt="{{ comic.title }}"
        (click)="detailComic(comic.id)"
      />

      <div class="product-body">
        <h5 class="product-title">{{ comic.title }}</h5>
        <p class="product-price">{{ comic.price }} €</p>

        <div class="product-actions">
          <button class="btn btn-cart" (click)="addToCart(comic)">🛒 Añadir al carrito</button>
          <button class="btn btn-delete" (click)="deleteComic(comic.id)">🗑️ Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <ng-template #sinFavoritos>
    <p class="no-fav-msg">No tienes cómics en favoritos aún.</p>
  </ng-template>
</div>
