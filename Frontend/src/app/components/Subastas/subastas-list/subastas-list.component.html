<!-- Botón flotante para abrir el sidebar -->
@if (authService.isLoggedIn()) {
  <button class="btn open-button" (click)="toggleSidebar()">
    Crear
  </button>
}

<!-- Sidebar deslizante -->
<div class="subastas-sidebar" [class.open]="isSidebarOpen">
  @if (isSidebarOpen) {
    <button class="close-button" (click)="toggleSidebar()">✕</button>
    <app-subastas-form></app-subastas-form>
  }
</div>

<!-- Listado de subastas -->
<div class="products">
  @for (auction of auctions; track auction.id) {
    <app-subastas-card [auction]="auction"></app-subastas-card>
  }
</div>
